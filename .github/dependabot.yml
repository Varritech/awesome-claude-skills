version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    reviewers:
      - christian-varritech
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    reviewers:
      - christian-varritech
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
