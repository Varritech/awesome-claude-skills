<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConvergeFlow — Get Started</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
    body{background:#111113;color:#fff;font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
    @media(prefers-reduced-motion:reduce){*{transition-duration:0ms!important;animation-duration:0ms!important}}

    .onboarding-shell{width:100%;max-width:480px;padding:24px;margin:0 auto}

    /* Logo */
    .logo{display:flex;align-items:center;gap:14px;margin-bottom:48px;justify-content:center}
    .logo-icon{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#F97316,#EA580C);display:flex;align-items:center;justify-content:center}
    .logo-text{font-size:28px;font-weight:700;letter-spacing:-0.04em}

    /* Progress */
    .progress{display:flex;gap:8px;margin-bottom:40px}
    .progress-step{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,0.06);overflow:hidden;position:relative}
    .progress-step.active{background:#F97316}
    .progress-step.active .progress-fill{width:100%;background:#F97316}
    .progress-fill{height:100%;width:0;background:#F97316;border-radius:2px;transition:width 600ms ease-out}
    .step-labels{display:flex;justify-content:space-between;margin-bottom:8px}
    .step-label{font-size:11px;color:rgba(255,255,255,0.2);font-weight:500}
    .step-label.active{color:#F97316}

    /* Card */
    .card{background:#1B1B1F;border-radius:24px;padding:40px 32px;text-align:center}
    .card h1{font-size:24px;font-weight:700;letter-spacing:-0.03em;margin-bottom:8px}
    .card p{font-size:14px;color:rgba(255,255,255,0.5);line-height:1.6;margin-bottom:32px}

    /* Google Button */
    .btn-google{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;color:#1B1B1F;font-size:16px;font-weight:700;padding:16px 28px;border-radius:14px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:transform 150ms ease,box-shadow 150ms ease}
    .btn-google:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(255,255,255,0.1)}
    .btn-google svg{flex-shrink:0}

    /* Divider */
    .divider-row{display:flex;align-items:center;gap:16px;margin:24px 0}
    .divider-line{flex:1;height:1px;background:rgba(255,255,255,0.06)}
    .divider-text{font-size:12px;color:rgba(255,255,255,0.2)}

    /* Email input */
    .input-group{display:flex;flex-direction:column;gap:12px}
    .input{width:100%;background:#222228;border:none;border-radius:14px;padding:14px 18px;font-size:14px;color:#fff;outline:none;font-family:'DM Sans',sans-serif}
    .input::placeholder{color:rgba(255,255,255,0.35)}
    .input:focus{border:2px solid #F97316;padding:12px 16px}

    .btn-primary{width:100%;background:#F97316;color:#fff;font-size:14px;font-weight:700;padding:14px 28px;border-radius:14px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:transform 150ms ease,box-shadow 150ms ease;margin-top:4px}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(249,115,22,0.3)}

    .footer-text{font-size:12px;color:rgba(255,255,255,0.2);margin-top:24px;text-align:center;line-height:1.6}
    .footer-text a{color:#F97316;text-decoration:none}

    /* Animate in */
    .card{animation:fadeUp 0.5s ease-out}
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
  <div class="onboarding-shell">

    <!-- Logo -->
    <div class="logo">
      <div class="logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 4L12 12L4 20" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 4L20 12L12 20" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span class="logo-text" style="font-style:italic;">ConvergeFlow</span>
    </div>

    <!-- Progress Steps -->
    <div class="step-labels">
      <span class="step-label active">Sign Up</span>
      <span class="step-label">Website</span>
      <span class="step-label">Inbox</span>
      <span class="step-label">Industry</span>
      <span class="step-label">Style</span>
    </div>
    <div class="progress">
      <div class="progress-step active"><div class="progress-fill" style="width:100%"></div></div>
      <div class="progress-step"></div>
      <div class="progress-step"></div>
      <div class="progress-step"></div>
      <div class="progress-step"></div>
    </div>

    <!-- Card -->
    <div class="card">
      <h1>Let's get you some customers.</h1>
      <p>Takes about 2 minutes. No credit card needed.</p>

      <!-- Google Sign Up -->
      <button class="btn-google" onclick="window.location.href='02b-path-selector.html'">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Sign up with Google
      </button>

      <div class="divider-row">
        <div class="divider-line"></div>
        <span class="divider-text">or use email</span>
        <div class="divider-line"></div>
      </div>

      <div class="input-group">
        <input type="email" class="input" placeholder="Your email address">
        <input type="password" class="input" placeholder="Pick a password">
        <button class="btn-primary" onclick="window.location.href='02b-path-selector.html'">Get Started</button>
      </div>
    </div>

    <p class="footer-text">
      By signing up you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
    </p>
  </div>

</body>
</html>
