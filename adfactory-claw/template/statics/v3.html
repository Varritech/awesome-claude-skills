<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,75..125,100..900&family=Chakra+Petch:ital,wght@0,400;0,600;0,700&display=swap">
<link rel="stylesheet" href="theme.css">
</head><body>
<div class="ad">
  <div class="sf-grid"></div>
  <div class="sf-blob b1"></div><div class="sf-blob b2"></div><div class="sf-blob b3"></div><div class="sf-blob b4"></div>
  <div class="ad-head">
    <img src="assets/varritech-logo-white-horizontal.png" alt="Varritech">
    <span class="price"><b>{{BADGE_B}}</b><span>{{BADGE_S}}</span></span>
  </div>
  <div class="ad-main">
    <div class="v3-top">
      <div class="v3-left">
        <h1 style="margin:0;font-family:Archivo,sans-serif;font-weight:850;letter-spacing:-.03em;line-height:.9"><span style="display:block;color:var(--acc);font-size:112px">{{BIG_N}}</span><span style="display:block;font-size:64px;letter-spacing:-.035em">{{BIG_W}}</span></h1>
        <p style="margin-top:14px;font-size:23px;line-height:1.34;color:rgba(245,245,245,.80)">{{SUB}}</p>
        <div class="v3-feats">{{FEATS}}</div>
      </div>
      <div class="v3-card">
        <span class="tag">{{CARD_TAG}}</span>
        <div class="sq">V</div>
        <div class="t">Awesome<br>Claude Skills</div>
        <div class="s">The Varritech Library</div>
      </div>
    </div>
    <div class="v3-panel">
      <div class="ph"><span class="l"><b></b>Skills Library</span><span class="r">All Skills &rarr;</span></div>
      <div class="v3-chips">{{CHIPS}}</div>
    </div>
    <div class="v3-hook">
      <p>{{HOOK}}</p>
      <span class="v3-cta"><i></i>{{CTA}}</span>
    </div>
  </div>
  <div class="ad-foot"><span>varritech.com</span><span>{{FOOT_RIGHT}}</span></div>
</div>
</body></html>
