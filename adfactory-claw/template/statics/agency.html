<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,75..125,100..900&family=Chakra+Petch:ital,wght@0,400;0,600;0,700&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
  .hz-urg{color:var(--acc)}
  .hz-urg i{background:var(--acc)}
  /* Agency ads sell a call, not a price. The struck-through price row the Skills
     templates use is replaced by the outcome + the timebox, which is what a
     founder is actually buying. */
  /* ⛔ theme.css is base+ad+hz+hz2+v3 concatenated in that order, so hz2's
     `.hz-cta{margin-top:26px}` overrides hz's `margin-top:auto` and the CTA stops
     being pushed to the bottom — leaving a ~160px dead band above the footer.
     Re-assert auto here; this block loads after the stylesheet. */
  .hz-main{justify-content:flex-start}
  .hz-cta{margin-top:auto}
  .hz-box{margin-top:26px}
  .ag-out{display:flex;align-items:baseline;gap:18px;margin-top:28px}
  /* The method stepper. Without it the frame has ~130px of dead ground between the
     stats row and the CTA — this is the "add a real element, don't stretch the type"
     fix, and it also previews what /prepare actually shows. */
  .ag-steps{display:flex;align-items:center;gap:10px;margin-top:28px}
  .ag-steps .s{flex:1;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px 10px;text-align:center}
  .ag-steps .s .k{font-family:'Archivo',sans-serif;font-weight:850;font-size:19px;letter-spacing:.04em;color:var(--txt)}
  .ag-steps .s .d{font-size:13px;color:rgba(245,245,245,.52);margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
  .ag-steps .s.on{border-color:rgba(128,255,0,.45);background:rgba(128,255,0,.09)}
  .ag-steps .s.on .k{color:var(--acc)}
  .ag-steps .ar{flex:none;color:rgba(245,245,245,.30);font-size:18px}
  .ag-out .n{font-family:'Archivo',sans-serif;font-weight:850;font-size:80px;color:var(--acc);line-height:.9;letter-spacing:-.035em}
  .ag-out .w{font-size:23px;line-height:1.24;color:rgba(245,245,245,.82);max-width:420px}
</style>
</head><body>
<div class="hz">
  <div class="sf-grid"></div>
  <div class="sf-blob b1"></div><div class="sf-blob b2"></div><div class="sf-blob b3"></div>
  <div class="hz-head">
    <img src="assets/varritech-logo-white-horizontal.png" alt="Varritech">
    <span class="hz-pill"><i>&#9733;&#9733;&#9733;&#9733;&#9733;</i>{{PILL}}</span>
  </div>
  <div class="hz-main">
    <div class="hz-eye">{{EYEBROW}}</div>
    <h1>{{H1}}</h1>
    <p class="hz-sub">{{SUB}}</p>
    <div class="hz-box">
      <div class="lb">// What you get</div>
      {{ROWS}}
    </div>
    <div class="ag-out"><span class="n">{{BIG}}</span><span class="w">{{BIG_WORD}}</span></div>
    <div class="hz-urg"><i></i>{{URGENCY}}</div>
    <div class="hz-stats">{{STATS}}</div>
    <div class="ag-steps">{{STEPS}}</div>
    <div class="hz-cta"><i></i>{{CTA}}</div>
  </div>
  <div class="hz-foot">
    <span class="chip">{{CHIP}}</span>
    <span class="txt">{{FOOT}}</span>
  </div>
</div>
</body></html>
