<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,75..125,100..900&family=Chakra+Petch:ital,wght@0,400;0,600;0,700&display=swap">
<link rel="stylesheet" href="theme.css">
<style>.ad-head .price{margin:0}</style>
</head><body>
<div class="ad">
  <div class="sf-grid"></div>
  <div class="sf-blob b1"></div><div class="sf-blob b2"></div><div class="sf-blob b3"></div><div class="sf-blob b4"></div>
  <div class="ad-head">
    <img src="assets/varritech-logo-white-horizontal.png" alt="Varritech">
    {{TOP_RIGHT}}
  </div>
  <div class="ad-main">
    <div class="hero">
      <div class="mock">
        <div class="k">The ultimate</div>
        <div class="t">Varritech<br>Skills</div>
        <div class="l">Library</div>
        <div class="sq"><b></b></div>
        <div class="f">{{MOCK_FOOT}}</div>
      </div>
      <div class="hd">
        <h1><span class="n">{{BIG_N}}</span><span class="w">{{BIG_W}}</span></h1>
        <div class="rule"></div>
        <p class="sub">{{SUB}}</p>
      </div>
    </div>
    <div class="chips">
      <div class="c"><div class="ic"><b></b></div><p>{{CHIP1}}</p></div>
      <div class="c"><div class="ic p"><b></b></div><p>{{CHIP2}}</p></div>
      <div class="c"><div class="ic d"><b></b></div><p>{{CHIP3}}</p></div>
      <div class="c"><div class="ic r"><b></b></div><p>{{CHIP4}}</p></div>
    </div>
    <div class="grid">{{GRID}}</div>
    <div class="hook">
      <p>{{HOOK}}</p>
      <span class="cta"><i></i>{{CTA}}</span>
    </div>
  </div>
  <div class="ad-foot">
    <span>varritech.com</span>
    <span>{{FOOT_RIGHT}}</span>
  </div>
</div>
</body></html>
